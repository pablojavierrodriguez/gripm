name: 🐛 Reporte de Error (Bug Report)
description: Reporta un error o comportamiento inesperado en gripm
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por tomarte el tiempo de reportar este problema. Asegúrate de verificar primero que el bug no haya sido reportado en issues existentes o en el [Backlog de gripm](https://github.com/pablojavierrodriguez/gripm/blob/main/BACKLOG.md).
  - type: textarea
    id: what-happened
    attributes:
      label: ¿Qué sucedió?
      description: Describe de forma concisa y clara el fallo o comportamiento inesperado.
      placeholder: Al hacer clic en... la interfaz arrojó un error en consola y...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Pasos para reproducir
      description: Pasos ordenados y deterministas para replicar el problema.
      value: |
        1. Iniciar con `npm run board` (o `npx gripm`)
        2. Navegar a '...'
        3. Hacer clic en '....'
        4. Observar el error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: ¿Qué debió haber sucedido en su lugar?
      placeholder: El modal debió cerrarse y la tarea actualizarse en el tablero sin recargar.
    validations:
      required: true
  - type: dropdown
    id: storage-engine
    attributes:
      label: Motor de almacenamiento utilizado
      description: ¿Qué modalidad de persistencia tiene configurada tu proyecto?
      options:
        - "Markdown distribuido (backlog/tasks/*.md)"
        - "JSON monolítico (.devboard/backlog.json)"
        - "No estoy seguro / N/A"
    validations:
      required: true
  - type: dropdown
    id: context
    attributes:
      label: Contexto de ejecución
      options:
        - "UI Web (navegador en localhost:4100)"
        - "CLI en terminal (gripm / gripm-mcp)"
        - "Servidor MCP (consumido por Cursor, Claude Code, Antigravity, etc.)"
        - "Scripts npm (test, build, backlog:check)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Entorno del sistema
      description: Sistema operativo y versión de Node.js (`node -v`).
      placeholder: macOS 14.5 / Node.js 22.8.0 / Chrome 128
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas de pantalla
      description: Pega trazas de error de terminal o consola del navegador si están disponibles.
      render: shell
