name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    # 35 min: la suite son 19 pasos y en runners Windows/macOS el npm install y la
    # compilación de binarios consumen bastante tiempo.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['22.6.0', '22.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Set up Python for YAML verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Verify defect classes outside pyramid (verify-changes)
        run: node scripts/verify-changes.js --all

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit (SCA)
        run: npm run audit:deps

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Build production bundle & standalone binaries
        run: npm run build

      - name: Run parser & integration test suite
        run: npm test

      - name: Verify Backlog integrity & sync
        run: npm run backlog:check

      - name: Verify Changelog sync with releases.json
        run: node scripts/generate-changelog.cjs --check

      - name: Run UX static audit
        run: npm run audit:ux

      - name: Guard publish surface (no local data in npm tarball)
        run: npm run publish:check

  ui-smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22.6.0
        uses: actions/setup-node@v5
        with:
          node-version: '22.6.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle & standalone binaries
        run: npm run build

      - name: Run browser smoke test
        run: npm run test:ui

  publish:
    name: Publish to npm & GitHub Release
    needs: [verify, ui-smoke]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22.6.0'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Check release components status
        id: check_status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="v${PKG_VERSION}"
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # 1. Verificar estado de publicación en npm
          if npm view "@gripm/board@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "npm_published=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️  @gripm/board@${PKG_VERSION} ya está publicado en npmjs."
          else
            echo "npm_published=false" >> "$GITHUB_OUTPUT"
            echo "🚀 @gripm/board@${PKG_VERSION} no está publicado en npmjs. Procederá publicación."
          fi

          # 2. Verificar estado de Git Tag en remoto
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️  Tag $TAG ya existe en el remoto."
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "🏷️  Tag $TAG no existe en el remoto. Procederá creación de tag."
          fi

          # 3. Verificar estado de GitHub Release
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️  GitHub Release $TAG ya existe."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "📦 GitHub Release $TAG no existe. Procederá creación de release."
          fi

      - name: Build package and verify distribution surface
        if: steps.check_status.outputs.npm_published == 'false'
        run: |
          set -euo pipefail
          npm run build
          npm run publish:check
          npm pack --dry-run

      - name: Publish to npm with provenance
        if: steps.check_status.outputs.npm_published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Create annotated git tag and push to remote
        if: steps.check_status.outputs.tag_exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.check_status.outputs.tag }}"
          echo "🏷️  Creando y publicando tag anotado $TAG..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG - Release oficial de @gripm/board"
          git push origin "$TAG"

      - name: Extract release notes
        if: steps.check_status.outputs.release_exists == 'false'
        run: node scripts/extract-release-notes.js "${{ steps.check_status.outputs.pkg_version }}"

      - name: Create GitHub Release
        if: steps.check_status.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.check_status.outputs.tag }}"
          RELEASE_TITLE="$(cat release-title.txt)"
          echo "🚀 Creando GitHub Release $TAG: $RELEASE_TITLE"
          gh release create "$TAG" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.txt \
            --latest
          echo "✅ GitHub Release $TAG creada exitosamente con flag --latest."
