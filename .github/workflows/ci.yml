name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    # 25 min: la suite son 15 pasos y en runners Windows/macOS el npm install +
# compilación de binarios consumen bastante. Antes en 15 y el job de ubuntu
# moría por timeout; la causa real (el sondeo de puertos colgado) está corregida
# en DEV-189, pero el margen evita que un runner lento se lea como un fallo.
timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['22.6.0', '22.x']

    env:
      NODE_OPTIONS: "--experimental-strip-types"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Run parser & integration test suite
        run: npm test

      - name: Verify Backlog integrity & sync
        run: npm run backlog:check

      - name: Run UX static audit
        run: npm run audit:ux

      - name: Build production bundle & standalone binaries
        run: npm run build

      - name: Guard publish surface (no local data in npm tarball)
        run: npm run publish:check
