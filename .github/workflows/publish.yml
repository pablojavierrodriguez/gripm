name: Publish

# DEV-182: publicar @gripm/board en el registro público de npm desde CI.
#
# El disparador es el push del tag `v*`. Ese tag es la única fuente de verdad del
# versionado: package.json y CHANGELOG.md se validan contra él antes de publicar,
# de modo que un tag mal cortado no llega al registro.
#
# Por qué NO se escucha `release: published`: con ambos disparadores, publicar el
# tag ya publica el package y después crear la GitHub Release dispara el workflow
# por segunda vez. Peor aún, en un evento `release` GitHub ejecuta la versión del
# workflow que está en el commit del tag, no la de `main`, así que cualquier
# arreglo posterior del workflow es invisible para esa corrida. El tag ya
# publicado no se puede mover. O sea: esa segunda corrida no se puede arreglar, solo
# evitar. Por eso el tag es el único disparador, y la GitHub Release se crea
# después como documentación.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.1.0)'
        required: false
        default: ''

# Cancelar una corrida anterior del mismo tag evita publicar dos veces si se
# re-lanza el job.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Verify and publish to npm
    runs-on: ubuntu-latest
    # 30 min: este job encadena los mismos 15 pasos de verificación más el
    # build, el dry-run y la publicación. Con 20 el margen era demasiado
    # ajustado para un runner lento.
    timeout-minutes: 30

    permissions:
      contents: write
      # OIDC: obligatorio para que npm pueda verificar la identidad del workflow
      # y emitir la attestation de provenance (DEV-182).
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22.6.0'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Resolve the version to publish
        id: version
        run: |
          set -euo pipefail
          INPUT_TAG="${{ github.event.inputs.tag }}"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$PKG_VERSION"
          fi

          if [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "::error::Tag $TAG no coincide con package.json ($PKG_VERSION)."
            exit 1
          fi

          # Exigir annotated tag cuando el trigger es un push de tag
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG_OBJECT="$(git ls-remote --tags origin "refs/tags/v$PKG_VERSION" | cut -f1)"
            if [ -z "$TAG_OBJECT" ]; then
              echo "::error::No se encuentra el tag v$PKG_VERSION en el remoto."
              exit 1
            fi

            if ! git ls-remote --tags origin "refs/tags/v$PKG_VERSION^{}" | grep -q .; then
              echo "::error::El tag v$PKG_VERSION no es annotated. Recrealo con 'git tag -a'."
              exit 1
            fi
          fi

          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify the tag is not already published
        id: already
        run: |
          set -euo pipefail
          if npm view "@gripm/board@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@gripm/board@${{ steps.version.outputs.version }} ya está publicado en npm."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      # ─── PIRAMIDE DE VERIFICACION Y BUILD ANTES DE PUBLICAR (DEV-221) ───
      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Run test suite
        run: npm test

      - name: Verify backlog integrity & sync
        run: npm run backlog:check

      - name: Run UX static audit
        run: npm run audit:ux

      - name: Build the package
        run: npm run build

      - name: Guard publish surface (no local data in npm tarball)
        run: npm run publish:check

      - name: Regenerate CHANGELOG from releases.json
        run: npm run changelog

      - name: Fail if the changelog is out of date
        run: |
          set -euo pipefail
          if ! git diff --quiet -- CHANGELOG.md; then
            echo "::error::CHANGELOG.md no refleja backlog/releases.json. Ejecutá 'npm run changelog' y commiteá."
            git diff -- CHANGELOG.md
            exit 1
          fi

      - name: Dry-run the package
        run: npm pack --dry-run

      # ─── PUBLICACION EN NPM CON PROVENANCE (DEV-221) ───
      - name: Publish to npm with provenance
        if: steps.already.outputs.already_published != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report already-published version
        if: steps.already.outputs.already_published == 'true'
        run: |
          echo "✅ @gripm/board@${{ steps.version.outputs.version }} ya estaba publicado en npm."
          echo "   Se omite la publicación repetida."

      # ─── AUTO-CREACION DE GITHUB RELEASE OFICIAL (DEV-221) ───
      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "✅ GitHub Release $TAG ya existe. Omitiendo creación duplicada."
          else
            echo "📦 Generando notas de la release desde backlog/releases.json..."
            node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('backlog/releases.json', 'utf8'));
              const list = Array.isArray(data) ? data : (data.releases || []);
              const rel = list.find(r => r.version === '$VERSION') || {};
              const title = rel.title || (rel.name ? \`$TAG - \${rel.name}\` : '$TAG');
              fs.writeFileSync('release-title.txt', title.trim());
              const notes = rel.markdownContent ? rel.markdownContent.replace(/\\r\\n|\\n/g, '\n').trim() : (rel.summary || rel.notes || 'Release oficial ' + '$TAG');
              fs.writeFileSync('release-notes.txt', notes.trim() + '\n');
            "

            RELEASE_TITLE="$(cat release-title.txt)"
            echo "🚀 Creando GitHub Release $TAG: $RELEASE_TITLE"
            gh release create "$TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.txt
            echo "✅ GitHub Release $TAG creada exitosamente."
          fi