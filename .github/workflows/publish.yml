name: Publish

# DEV-182: publicar @gripm/board en el registro público de npm desde CI.
#
# El disparador es el push del tag `v*`. Ese tag es la única fuente de verdad del
# versionado: package.json y CHANGELOG.md se validan contra él antes de publicar,
# de modo que un tag mal cortado no llega al registro.
#
# Por qué NO se escucha `release: published`: con ambos disparadores, publicar el
# tag ya publica el package y después crear la GitHub Release dispara el workflow
# por segunda vez. Peor aún, en un evento `release` GitHub ejecuta la versión del
# workflow que está en el commit del tag, no la de `main`, así que cualquier
# arreglo posterior del workflow es invisible para esa corrida. El tag ya
# publicado no se puede mover. O sea: esa segunda corrida no se puede arreglar, solo
# evitar. Por eso el tag es el único disparador, y la GitHub Release se crea
# después como documentación.

on:
  push:
    tags: ['v*']

# Cancelar una corrida anterior del mismo tag evita publicar dos veces si se
# re-lanza el job.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish to npm
    runs-on: ubuntu-latest
    # 30 min: este job encadena los mismos 15 pasos de verificación más el
    # build, el dry-run y la publicación. Con 20 el margen era demasiado
    # ajustado para un runner lento.
    timeout-minutes: 30

    permissions:
      contents: read
      # OIDC: obligatorio para que npm pueda verificar la identidad del workflow
      # y emitir la attestation de provenance (DEV-182).
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.6.0'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Resolve the version to publish
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "::error::Tag $TAG no coincide con package.json ($PKG_VERSION)."
            exit 1
          fi

          # Exigir annotated tag: un tag lightweight no lleva mensaje y aun asi
          # se publica, dejando la release de GitHub sin contexto.
          #
          # En un evento de push de tag, actions/checkout deja HEAD detached en
          # el commit y el ref del tag no queda disponible para cat-file. Por eso
          # se consulta el objeto etiquetado en el remoto en lugar del ref local.
          TAG_OBJECT="$(git ls-remote --tags origin "refs/tags/v$PKG_VERSION" | cut -f1)"
          if [ -z "$TAG_OBJECT" ]; then
            echo "::error::No se encuentra el tag v$PKG_VERSION en el remoto."
            exit 1
          fi

          # Un tag annotated expone una segunda linea "refs/tags/<tag>^{}" que
          # desreferencia al commit. Un lightweight expone solo una.
          if ! git ls-remote --tags origin "refs/tags/v$PKG_VERSION^{}" | grep -q .; then
            echo "::error::El tag v$PKG_VERSION no es annotated. Recrealo con 'git tag -a'."
            exit 1
          fi

          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify the tag is not already published
        id: already
        run: |
          set -euo pipefail
          if npm view "@gripm/board@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            # El flujo normal publica dos veces: al pushear el tag y de nuevo al
            # crear la GitHub Release, porque el workflow escucha ambos eventos.
            # La segunda corrida no es un error, es el mismo release. Cortar acá
            # con exito, en vez de fallar, evita un run rojo que parece un
            # problema de publicacion cuando en realidad ya se publico bien.
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@gripm/board@${{ steps.version.outputs.version }} ya está publicado. No hay nada que hacer."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with provenance
        if: steps.already.outputs.already_published != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report already-published version
        if: steps.already.outputs.already_published == 'true'
        run: |
          echo "✅ @gripm/board@${{ steps.version.outputs.version }} ya estaba publicado."
          echo "   Se omite la publicación para no duplicar el release."

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Run test suite
        run: npm test

      - name: Verify backlog integrity & sync
        run: npm run backlog:check

      - name: Run UX static audit
        run: npm run audit:ux

      # El guard de superficie empaqueta el tarball y exige `dist/index.html`.
      # Por eso el build tiene que precederlo: antes el build estaba después del
      # guard, así que en un runner limpio `dist/` no existía y el paso fallaba
      # con "FALTA EN EL TARBALL". Localmente pasaba solo porque `dist/` ya
      # estaba de una corrida anterior de `npm run build`. El paso nunca se
      # había validado en CI porque las corridas previas morían antes, en el
      # test suite.
      - name: Build the package
        run: npm run build

      - name: Guard publish surface (no local data in npm tarball)
        run: npm run publish:check

      - name: Regenerate CHANGELOG from releases.json
        run: npm run changelog

      - name: Fail if the changelog is out of date
        run: |
          set -euo pipefail
          if ! git diff --quiet -- CHANGELOG.md; then
            echo "::error::CHANGELOG.md no refleja backlog/releases.json. Ejecutá 'npm run changelog' y commiteá."
            git diff -- CHANGELOG.md
            exit 1
          fi

      - name: Dry-run the package
        run: npm pack --dry-run